# Test-only tooling inputs for synthetic projects inside tests/fixturesroot: a workspace file
# written in the checkout itself, so every path resolves from the checkout.
# Not a template or default for a real project. No operation is authorized.
workspace_version = 1
odoo_version = '19.0'

[tooling]
community = '../../source/odoo'
environment = '../../environments/example'
config = 'dev/odoo.conf'
env_file = 'dev/.env'
compose = 'dev/compose.yml'
requirements = 'dev/requirements'
addons_paths = ['.']
db_service = 'db'
dev_prefix = 'cc_dev_'
test_prefix = 'cc_test_'
