# Optional project-local declarations for an explicitly authorized project.
# Values are placeholders, not defaults, discovery, access consent or executable checks.
# Never add credentials or read/log runtime config or env-file contents.
[odoo]
# Consultation roots only; this does not expand installed-tool module roots.
addons_paths = ['addons', 'source/enterprise']

[environment]
# Dependency/lock metadata; never grants permission to access external paths.
dependency_inputs = ['requirements.txt']
lock_files = ['requirements.lock']

# The installed tooling reads only [tooling]; these paths and namespace guards
# must be adapted to the actual project before use. A template never authorizes
# an operation or an external path read/write.
[tooling]
version = '19.0'
python_version = '3.12'
community = 'source/odoo'
environment = '.venv'
config = 'local/odoo.conf'
env_file = 'local/.env'
compose = 'local/compose.yml'
requirements = 'dev/requirements'
addons_paths = ['addons']
# Optional; only lint-module consumes it. File/plugins must exist and be trusted.
# lint_rcfile = 'dev/lint/.pylintrc'
db_service = 'db'
dev_prefix = 'sample_dev_'
test_prefix = 'sample_test_'
# Optional reusable sequential test target; never implies reset permission.
# test_database = 'sample_test_suite'
# Optional checkout slug: 1-20 of a-z, 0-9 and _, starting with a letter or digit.
# Linked git worktrees derive it from their directory name; set it to override
# that, or to give the main checkout a slug. A slug changes every default database
# name and limits database arguments to the <prefix><slug>_ namespace.
# checkout_slug = 'sample_07_1'
# Optional logs directory, relative to the checkout. Compact runs and browser
# evidence go to <logs>/<slug, or main for the main checkout>/run-*;
# without it they stay under dev/logs/odoo19. Point every checkout at the same one.
# logs = '../logs'

# Optional advisory command discovery, never shell strings or authorization.
# Expand ~ for the current user; use an absolute --project root as separate args.
# [commands]
# entrypoint = '~/.agents/skills/odoo19/oasis'
# check_environment = 'check-environment'
# bootstrap = 'bootstrap'
# install = 'install-module'
# update = 'update-module'
# test = 'test-module'
# module_status = 'module-status'
# odoo_shell = 'odoo-shell'
# lint = 'lint-module'
